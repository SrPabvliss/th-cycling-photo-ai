type: color_analysis
name: kmeans_v1
seed: 42
# Pre-filter / partition (ADR-012 etapa 3 — extended)
# Pixels with chroma < chroma_min are routed to achromatic buckets (negro/gris/blanco)
# instead of being discarded. See EXPERIMENT_LOG_COLOR Run 4 (deviation from ADR-012).
chroma_min: 10.0
lum_min: 0.0           # never discard low end; pure black routed to negro bucket
lum_max: 99.0          # discard only true specular blowout
lum_black_max: 25.0    # achromatic L < 25 → negro
lum_white_min: 80.0    # achromatic L > 80 → blanco
min_chromatic_for_cluster: 100
# Illumination (etapa 2)
apply_gray_world: true
# Submuestreo (etapa 4)
max_pixels: 20000
# K-Means (etapa 5)
k_initial: 5
n_init: 5
max_iter: 100
use_minibatch: false
minibatch_size: 1024
# Post-processing (etapa 6)
tau_de_fusion: 12.0
tau_proportion: 0.08
max_colors: 3
# Validation (etapa 1)
min_side_px: 32
min_total_px: 1024
# Quality flags (etapa 7)
low_confidence_de_threshold: 20.0
model_version: kmeans-v1
