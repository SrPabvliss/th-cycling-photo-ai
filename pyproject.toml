[project]
name = "cycling-photo-ai"
version = "0.1.0"
description = "Proprietary object detection model for automated cycling photography classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Training
    "ultralytics>=8.3.0",
    "rfdetr>=1.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    # Evaluation
    "pycocotools>=2.0.8",
    "tidecv>=1.0.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    # Dataset
    "roboflow>=1.1.0",
    "fiftyone>=1.0.0",
    # Inference microservice
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "onnxruntime>=1.19.0",
    # Utilities
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "lmdb>=2.2.0",
    "transformers>=4.40.0,<4.50.0",
    "sentencepiece>=0.2.1",
    "psutil>=5.9.0",
    # Color analysis (Epic 3) — Gemini SDK required by GeminiColorStrategy
    "google-genai>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "scikit-image>=0.24.0",
    "python-multipart>=0.0.9",
    # PARSeq runtime requirements — baudm/parseq importa estos en eager-load.
    # NO declarados en hubconf dependencies de PARSeq → deben estar acá explícitos.
    # Sin nltk: strhub/models/base.py crashea con ModuleNotFoundError en startup.
    "pytorch-lightning>=2.0.0",
    "nltk>=3.7.0",
    # Modal (training infra)
    "modal>=1.4.2",
    "timm>=0.9.16",
    "streamlit>=1.57.0",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "pre-commit>=3.8.0",
    "ipykernel>=6.29.0",
]
audit = [
    "cleanlab>=2.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
]

[tool.ruff.lint.isort]
known-first-party = ["cycling_photo_ai"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cycling_photo_ai"]
