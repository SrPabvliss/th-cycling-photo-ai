name: Deploy Production

# TIT-21: VPS inference dado de baja (prod en Modal). Auto-deploy desactivado;
# queda solo manual (workflow_dispatch) por si hay que relevantar el VPS.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WEIGHTS_VERSION: v1

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Cache model weights
        id: weights-cache
        uses: actions/cache@v4
        with:
          path: weights
          key: weights-${{ env.WEIGHTS_VERSION }}

      - name: Download weights from B2
        if: steps.weights-cache.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          mkdir -p weights
          aws s3 cp \
            "s3://${{ secrets.B2_WEIGHTS_BUCKET }}/${{ env.WEIGHTS_VERSION }}/" \
            weights/ \
            --recursive \
            --endpoint-url "${{ secrets.B2_ENDPOINT }}"
          echo "--- Downloaded ---"
          du -sh weights/*

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
