  # Adapters use model_id "gemini-3.1-pro-preview"; YAML key kept as
  # gemini_3_pro for app/system_id compatibility.
  model_identifier: "gemini-3.1-pro-preview"
  input_per_1m_usd: 2.00
  output_per_1m_usd: 12.00
  cached_input_per_1m_usd: 0.20
  input_per_1m_usd_long: 4.00  # >200k context
  output_per_1m_usd_long: 18.00  # >200k context
  note: "≤200k tier. Output includes thinking tokens (no separate SKU). gemini-3-pro-preview retired; gemini-3.1-pro-preview is current. Preview status — re-verify every 60d until GA."
  source_url: "https://ai.google.dev/gemini-api/docs/pricing"
  retirement_notice_url: "https://ai.google.dev/gemini-api/docs/models"

