# apps/comparison_viewer/config/pricing.yaml
# Snapshot date: 2026-05-03 (re-verified via deep research same day)
#
# Verification status (2026-05-03 deep research vs official pricing pages):
#   ✅ claude_opus_4_7, claude_haiku_4_5, gemini_2_5_flash, gpt_5, gpt_4o_mini,
#      google_vision_text_detection, aws_rekognition_detect_text — exact match.
#   ⚠️ gemini_2_5_pro — output rate correct, but `thinking_per_1m_usd` removed:
#      no separate thinking SKU; Google bills thinking inside output rate.
#   ❌ gemini_3_pro: model `gemini-3-pro-preview` was retired 2026-03-09 (API)
#      / 2026-03-26 (Vertex). Replacement `gemini-3.1-pro-preview` priced
#      $2.00/$12.00 (≤200k). YAML key kept as `gemini_3_pro` for app compat;
#      model identifier in adapters/calls/ocr.py updated to gemini-3.1-pro-preview.
#   ⚠️ roboflow_serverless: April-2026 published rate is 1 credit / 3,000 images
#      at $4/credit prepaid → ~$0.00133/inference. Doc-page formula
#      (max(processing_ms, 100ms) / 500_000ms) implies lower rate for fast
#      inference but is overridden by the $4/credit blog rate (citable).
#
# Caveats from deep research (apply per-workload, not enforced in YAML):
#   - Claude Opus 4.7 new tokenizer can produce ~35% more tokens than 4.6 for
#     same text → effective cost rises even though rate card unchanged.
#   - Anthropic `inference_geo: us-only` carries 1.1× multiplier (not default).
#   - Gemini 2.5 Pro / 3.1 Pro context cache storage adds $4.50/M-tokens-per-hour
#     on top of cache-read rate (only matters if caching at scale).
#   - AWS Rekognition DetectText is NOT available in sa-east-1 (São Paulo);
#     only face APIs work there. Use us-east-1 (verified via AWS general
#     reference 2026-05-03). Cross-region egress + RTT applies if source
#     data lives in BR/SA AWS regions.
#   - Google Vision: 1 unit = 1 feature-per-image. TEXT_DETECTION + LABEL_DETECTION
#     on same image = 2 units.
snapshot_date: "2026-05-03"

# --- Detection ---
roboflow_serverless:
  unit: per_inference
  # Citable rate (April 2026 Roboflow blog): 1 credit = 3,000 images, $4/credit
  # → $4/3000 ≈ $0.00133 per inference.
  # Doc formula gives lower rate for fast inference; we use the published
  # $4/credit rate as the citable upper bound for thesis cost reporting.
  paid_per_inference_usd: 0.00133
  images_per_credit_v2: 3000  # Serverless Hosted API v2 (current endpoint)
  inferences_per_credit_v1: 1000  # legacy v1 endpoint (not used here)
  usd_per_credit_prepaid: 4.00
  usd_per_credit_flex_overrun: 6.00
  usd_per_credit_core_plan_base: 1.58  # $79/50 credits (Core plan included quota)
  free_tier_credits_per_month_public: 15
  starter_plan_credits_per_month: 30  # $49/mo plan
  note: |
    Citable rate $0.00133 = $4/credit ÷ 3000 imgs/credit (v2 endpoint at
    serverless.roboflow.com). COLD-START PENALTY: v2 bills GPU execution time
    (1 credit = 500s). Cold boot adds 500-3000ms billable time per request.
    Burst-mode workloads can inflate effective per-image cost up to ~$0.004
    (matches v1 prepaid rate). Worst-case overrun at flex rate: $0.006/img.
    First 15 credits/month free on Public plan (≈45k images).
  source_url: "https://roboflow.com/credits"
  blog_reference_url: "https://blog.roboflow.com/serverless-inference-vision-ai-cost-comparison/"
  plan_pricing_url: "https://roboflow.com/pricing"

gemini_2_5_pro:
  unit: tokens
  # ≤200k context tier (standard for our single-image detection prompts)
  input_per_1m_usd: 1.25
  output_per_1m_usd: 10.00
  cached_input_per_1m_usd: 0.125
  # NOTE: no separate thinking_per_1m_usd field — Google bills thinking
  # tokens inside the output rate (output_per_1m_usd already includes them).
  note: "≤200k tier. Output rate includes thinking tokens (no separate SKU). Tokens >200k: input $2.50, output $15.00, cached $0.25. Cache storage extra at $4.50/M-tokens-per-hour."
  source_url: "https://ai.google.dev/gemini-api/docs/pricing"

# --- OCR cloud ---
google_vision_text_detection:
  unit: per_1k_units
  free_tier_per_month: 1000
  paid_per_1k_usd: 1.50
  paid_per_1k_usd_above_5m: 0.60
  note: "$1.50/1k units for 1,001–5M units/month; $0.60/1k above 5M. 1 unit = 1 feature-per-image."
  source_url: "https://cloud.google.com/vision/pricing"

aws_rekognition_detect_text:
  unit: per_1k_images
  paid_per_1k_usd: 1.00
  paid_per_1k_usd_tier2: 0.80  # 1M–5M
  paid_per_1k_usd_tier3: 0.60  # 5M–35M
  paid_per_1k_usd_tier4: 0.25  # >35M
  region: "us-east-1"  # CHANGED from sa-east-1 — DetectText NOT available in São Paulo
  free_tier_first_year_per_month: 5000
  note: |
    Group 2 API, Tier 1 (≤1M images/month). VERIFIED 2026-05-03: sa-east-1
    (São Paulo) only supports face-related ops (DetectFaces, CompareFaces,
    IndexFaces, etc.). DetectText is NOT available there. Set AWS_REGION=us-east-1
    in .env. If S3 source data lives in sa-east-1, plan for cross-region egress
    fees + ~150-250ms RTT latency overhead.
  source_url: "https://aws.amazon.com/rekognition/pricing/"
  region_availability_url: "https://docs.aws.amazon.com/general/latest/gr/rekognition.html"

# --- OCR VLMs ---
gemini_3_pro:
